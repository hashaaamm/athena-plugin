# The whole local stack. `just dev` from a clean clone must reach a running service in under five
# minutes. Ask Athena for the local development and command runner rules.
#
# This file is at the repository ROOT, not in backend/, because it orchestrates more than one
# component: today the database and the backend, tomorrow the frontend alongside them. A compose
# file per component cannot express "the frontend waits for the backend to be healthy".

name: {{ cookiecutter.project_slug }}

services:
  backend: &backend
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    env_file: .env
    environment:
      # Pinned here so a .env tuned for host access (localhost:5432) still works inside the
      # container, where the database is reachable as db:5432.
      {%- if cookiecutter.use_postgres == "yes" %}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      {%- endif %}
      ENVIRONMENT: local
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      {%- if cookiecutter.use_postgres == "yes" %}
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      {%- endif %}
      - ./backend/pyproject.toml:/app/pyproject.toml
      # Needed by `lint-imports`, which is part of `just lint`.
      - ./backend/.importlinter:/app/.importlinter
    ports:
      - "8000:8000"
      - "5678:5678"   # debugpy
    {%- if cookiecutter.use_postgres == "yes" %}
    depends_on:
      db:
        condition: service_healthy
    {%- endif %}

  # Same image and same mounts, no server. Used by `just lint`, `just fmt`, `just db-*`.
  # Keeping tooling in the image CI uses is what stops "passes locally, fails in CI".
  dev-runner:
    <<: *backend
    ports: []
    command: ["sleep", "infinity"]
    profiles: ["tools"]
{% if cookiecutter.use_postgres == "yes" %}
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-{{ cookiecutter.project_slug.replace('-', '_') }}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-not-a-secret}
      POSTGRES_DB: ${POSTGRES_DB:-{{ cookiecutter.project_slug.replace('-', '_') }}}
    ports:
      # Overridable, because the host port is the one thing in this file that can collide with
      # something outside the project. Two services generated from this template, or one alongside
      # any other Postgres on the machine, otherwise fail to start with "port is already
      # allocated" — which reads as a problem with the new project rather than with the port.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # `depends_on` alone does not wait for readiness; this is what makes it mean something.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-{{ cookiecutter.project_slug.replace('-', '_') }}}"]
      interval: 2s
      timeout: 3s
      retries: 30
{% endif %}{%- if cookiecutter.include_frontend == "yes" %}
  # The web client. A stock Node image with the source bind-mounted, rather than a dev image to
  # build and rebuild: Vite's dev server is the same binary everywhere, and the only thing an
  # image would add here is a cache to invalidate. The production image is a different file
  # entirely — frontend/docker/Dockerfile.prod.
  frontend:
    image: node:24-slim
    working_dir: /app
    # corepack activates the exact pnpm pinned in package.json's `packageManager` field, so the
    # container and CI resolve dependencies identically. --frozen-lockfile makes a stale lockfile
    # a startup failure rather than a silent re-resolve: run `cd frontend && just lock` and commit.
    # `exec` on the last command so Vite becomes PID 1 and receives SIGTERM directly.
    # Without it `sh` holds PID 1, the signal never reaches Vite, and `docker compose down`
    # waits out the full stop timeout on every shutdown.
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && exec pnpm dev"
    environment:
      # The BROWSER makes these requests, so this is the host's address, not `backend:8000`.
      # Vite inlines it at build time; here the dev server reads it on start.
      VITE_API_URL: "http://localhost:8000"
    volumes:
      - ./frontend:/app
      # A named volume, so the container's node_modules (Linux binaries) never collide with a
      # host install (macOS binaries) through the bind mount above.
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      # Started, not healthy: the dev server should come up and show the API as unreachable
      # rather than refuse to start because the backend is still migrating.
      backend:
        condition: service_started
{%- endif %}
{% if cookiecutter.use_postgres == "yes" or cookiecutter.include_frontend == "yes" %}
volumes:
{%- if cookiecutter.use_postgres == "yes" %}
  db-data:
{%- endif %}
{%- if cookiecutter.include_frontend == "yes" %}
  frontend-node-modules:
{%- endif %}
{%- endif %}
