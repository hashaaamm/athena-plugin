# The dev stack. Cheapest viable configuration at every layer.
#
# `pulumi stack init dev --secrets-provider="awskms://alias/pulumi-state?region=…"` records
# `secretsprovider` and `encryptedkey` in this file alongside the configuration below. The bootstrap
# script prints the exact command.
config:
  # Quoted, and it has to be: an account id is a string of twelve digits, and YAML reads an
  # unquoted one that starts with 0 as a shorter number. The provider refuses every other account.
  {{ cookiecutter.project_slug }}:accountId: "{{ cookiecutter.aws_account_id }}"
  {{ cookiecutter.project_slug }}:region: {{ cookiecutter.aws_region }}
  # The STACK's environment. All it does is name resources — `api-dev`, and every role, secret,
  # repository and log group with the same suffix. The application never sees it. `prod` is the
  # one value that changes behaviour: deletion protection, final snapshots, secret recovery
  # windows and longer log retention all hang off it.
  {{ cookiecutter.project_slug }}:environment: dev
  # The APPLICATION's environment: the `ENVIRONMENT` variable on the task, and one of local / test
  # / staging / production. It decides how the service behaves — `production` serves no `/docs`
  # and no `/openapi.json`. Separate from the line above because a stack called `dev` that the
  # whole company can reach is production to the application, and a stack called `prod` standing
  # up a demo is not. Set it to `production` in the stack real users reach.
  {{ cookiecutter.project_slug }}:appEnvironment: staging
  # Every resource name is built from this, so it is not decoration: changing it renames the
  # Express service, the repositories, the roles and the secrets.
  {{ cookiecutter.project_slug }}:slug: {{ cookiecutter.project_slug }}
  # The CI roles trust exactly this repository. Anything else here means a different repository
  # on GitHub can assume them.
  {{ cookiecutter.project_slug }}:githubRepository: {{ cookiecutter.github_repository }}
  # The start of the `sub` claim GitHub issues for that repository. Empty means the name-only form,
  # repo:{{ cookiecutter.github_repository }}. Many repositories now get the immutable form with
  # numeric ids instead, and a trust policy for the wrong form admits no token at all. Ask GitHub:
  #   gh api repos/{{ cookiecutter.github_repository }}/actions/oidc/customization/sub --jq .sub_claim_prefix
  # and paste what it prints. sync-github.sh checks the two agree before it un-gates CD.
  {{ cookiecutter.project_slug }}:githubSubjectPrefix: ""
  # Express Mode cannot scale to zero: one task is the floor, and it bills whether or not anybody
  # calls it. infra/README.md has the cost table.
  {{ cookiecutter.project_slug }}:minTasks: "1"
  {{ cookiecutter.project_slug }}:maxTasks: "4"
  # The smallest Fargate task: a quarter of a vCPU and 512 MiB. Pairs Fargate does not offer are
  # refused by config.py when the stack loads.
  {{ cookiecutter.project_slug }}:cpu: "256"
  {{ cookiecutter.project_slug }}:memory: "512"
  # Express Mode needs at least two subnets, in two zones. Three buys a third zone and nothing else.
  {{ cookiecutter.project_slug }}:availabilityZoneCount: "2"
  # The origins a browser client is served from, comma-separated: CORS_ORIGINS on the service.
  # Empty means no browser on another origin may call this API. A browser client is its own
  # repository and stack, generated from templates/cookiecutter-react-app (ADR-0022); put its
  # `site_url` output here. infra/README.md has the step, and why the default hostnames sign a
  # user out on every reload.
  {{ cookiecutter.project_slug }}:corsOrigins: ""
{%- if cookiecutter.use_postgres == "yes" %}
  # Where the refresh token travels: REFRESH_TRANSPORT on the service. `body` for a server-to-server
  # caller; `cookie` for a browser, which must keep it where script cannot read it. `cookie` needs
  # corsOrigins: the cookie routes' CSRF check accepts only listed origins.
  {{ cookiecutter.project_slug }}:refreshTransport: body
  # RDS for PostgreSQL. A burstable Graviton micro with 20 GB of gp3, in one zone, is the floor for
  # a managed Postgres on AWS, and with the service's one task it is the standing charge in this
  # stack. infra/README.md has the table of why each value is already its minimum.
  {{ cookiecutter.project_slug }}:databaseInstanceClass: db.t4g.micro
  {{ cookiecutter.project_slug }}:databaseStorageGb: "20"
  {{ cookiecutter.project_slug }}:databaseMultiAz: "false"
{%- endif %}
{%- if cookiecutter.use_sentry == "yes" %}
  # Set to the `VersionId` that
  # `aws secretsmanager put-secret-value --secret-id {{ cookiecutter.project_slug }}-sentry-dsn-dev --secret-string …`
  # prints. Until then the secret is empty, and referencing an empty secret fails the deploy
  # rather than starting the service without error tracking.
  {{ cookiecutter.project_slug }}:sentryDsnVersion: ""
{%- endif %}
