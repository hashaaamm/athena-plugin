# Infrastructure CI.
#
# The component tests run on every pull request and need no cloud credentials — that is most of the
# argument for Pulumi over HCL, so it is the cheapest and most-run job here. The preview needs
# cloud access and is gated on the stack having been applied at least once; its diff is posted to
# the pull request, because a preview nobody reads is not a review.
#
# This file is copied verbatim by cookiecutter (`_copy_without_render` in cookiecutter.json).
# GitHub Actions' ${{ ... }} and Jinja's {{ ... }} are the same two braces, so rendering this file
# would strip every expression in it. Nothing here may contain a cookiecutter variable; anything
# project-specific comes from a repository variable instead.
name: Infrastructure

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
      # The contract test reads the deploy workflow: a renamed `vars.` there is a test failure
      # here, and a pull request that renames one has to run it.
      - '.github/workflows/cd.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
      - '.github/workflows/cd.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write        # the OIDC token the preview role is assumed with
  pull-requests: write   # the preview comments its diff

defaults:
  run:
    working-directory: infra/pulumi

jobs:
  static:
    name: Lint, types and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: infra/pulumi/uv.lock
      - run: uv sync --frozen        # fails loudly on a stale lockfile
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest -q

  preview:
    name: Preview
    runs-on: ubuntu-latest
    needs: [static]
    # Inert until the stack has been applied once and sync-github.sh has set the variables. A
    # preview against a stack that does not exist fails on state, not on the change under review.
    #
    # Pull requests only, and from this repository only: the preview role trusts
    # `repo:<owner>/<repo>:pull_request`, and GitHub gives a pull request from a fork no OIDC token
    # at all, so a stranger's branch can never reach it.
    if: github.event_name == 'pull_request' && vars.AWS_PREVIEW_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: infra/pulumi/uv.lock
      - run: uv sync --frozen

      # Keyless, and the preview role rather than the deploy role: read-only across the account,
      # plus this project's state and its lock file. Pin this to a digest rather than `@v4` before
      # you rely on the pipeline: the house rule is a released major at minimum, and a pinned digest
      # for anything that handles credentials.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # No login step: infra/pulumi/Pulumi.yaml names the S3 backend, and the stack's secrets
      # provider is the KMS key the preview role may decrypt with.
      - uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: dev
          work-dir: infra/pulumi
          # Load-bearing, not hygiene. CD updates the Express service's image out of band; without
          # a refresh Pulumi's state still holds the previous image, `ignore_changes` has nothing to
          # preserve, and the preview proposes rolling the service back to it.
          refresh: true
          # A destructive change must be visible in review, not discovered in apply output.
          comment-on-pr: true
          diff: true
