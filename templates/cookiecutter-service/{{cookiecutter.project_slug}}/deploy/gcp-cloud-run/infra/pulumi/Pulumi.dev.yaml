# The dev stack. Cheapest viable configuration at every layer.
#
# `pulumi stack init dev --secrets-provider=gcpkms://...` records `secretsprovider` and
# `encryptedkey` in this file alongside the configuration below. The bootstrap script prints the
# exact command with the key it created.
config:
  {{ cookiecutter.project_slug }}:project: {{ cookiecutter.gcp_project_id }}
  {{ cookiecutter.project_slug }}:region: {{ cookiecutter.gcp_region }}
  # The STACK's environment. All it does is name resources — `api-dev`, and every account,
  # secret and repository with the same suffix. The application never sees it.
  {{ cookiecutter.project_slug }}:environment: dev
  # The APPLICATION's environment: the `ENVIRONMENT` variable on the Cloud Run revision, and one
  # of local / test / staging / production. It decides how the service behaves — `production`
  # serves no `/docs` and no `/openapi.json`. Separate from the line above because a stack called
  # `dev` that the whole company can reach is production to the application, and a stack called
  # `prod` standing up a demo is not. Set it to `production` in the stack real users reach.
  {{ cookiecutter.project_slug }}:appEnvironment: staging
  # Every resource name is built from this, so it is not decoration: changing it renames the
  # Cloud Run service, the registry repository and the service accounts.
  {{ cookiecutter.project_slug }}:slug: {{ cookiecutter.project_slug }}
  # Workload Identity Federation is scoped to exactly this repository. Anything else here means
  # any repository on GitHub can assume the CI identity.
  {{ cookiecutter.project_slug }}:githubRepository: {{ cookiecutter.github_repository }}
  # Scaling to zero is the single biggest cost lever: an idle service costs nothing. Raise the
  # minimum only when a measured cold start is the problem.
  {{ cookiecutter.project_slug }}:minInstances: "0"
  {{ cookiecutter.project_slug }}:maxInstances: "4"
  # The origins a browser client is served from, comma-separated: CORS_ORIGINS on the service.
  # Empty means no browser on another origin may call this API. A browser client is its own
  # repository and stack, generated from templates/cookiecutter-react-app (ADR-0022); put its
  # `site_url` output here. infra/README.md has the step, and why the default hostnames sign a
  # user out on every reload.
  {{ cookiecutter.project_slug }}:corsOrigins: ""
{%- if cookiecutter.use_postgres == "yes" %}
  # Where the refresh token travels: REFRESH_TRANSPORT on the service. `body` for a server-to-server
  # caller; `cookie` for a browser, which must keep it where script cannot read it. `cookie` needs
  # corsOrigins: the cookie routes' CSRF check accepts only listed origins.
  {{ cookiecutter.project_slug }}:refreshTransport: body
  # Cloud SQL. Shared-core with 10 GB of HDD is the floor for a managed Postgres on GCP, and it is
  # the only standing charge in this stack. There is no cheaper setting to find: infra/README.md
  # has the table of why each value is already its minimum, and what the floor costs you.
  {{ cookiecutter.project_slug }}:databaseTier: db-f1-micro
  {{ cookiecutter.project_slug }}:databaseDiskGb: "10"
{%- endif %}
{%- if cookiecutter.use_sentry == "yes" %}
  # Set to the version number `gcloud secrets versions add {{ cookiecutter.project_slug }}-sentry-dsn-dev --data-file=-`
  # prints. Until then the container is empty, and mounting an empty container fails the deploy
  # rather than starting the service without error tracking.
  {{ cookiecutter.project_slug }}:sentryDsnVersion: ""
{%- endif %}
