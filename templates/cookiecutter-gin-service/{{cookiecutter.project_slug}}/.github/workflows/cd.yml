# Build, push and deploy the backend to Cloud Run.
#
# Inert until configured: every job is gated on `vars.WIF_PROVIDER`, so a freshly generated repo
# has a reviewed deploy path that cannot fire by accident. Set the repository variables below and
# it starts working — no edit to this file required.
#
#   WIF_PROVIDER          projects/…/workloadIdentityPools/…/providers/github
#   DEPLOY_SA             deployer@<project>.iam.gserviceaccount.com
#   GCP_REGION            europe-west1
#   IMAGE_REPO            europe-west1-docker.pkg.dev/<project>/<repo>
#   CLOUD_RUN_SERVICE     the Cloud Run service name
#   CLOUD_RUN_MIGRATE_JOB the Cloud Run job that runs `/app/api migrate up` (unset if no database)
#
# Do not set them by hand. `infra/pulumi` exports every one of them and
# `./infra/scripts/sync-github.sh` copies them in, so the names on both sides cannot drift — a
# stack exporting `workload_identity_provider` to a pipeline reading `vars.WIF_PROVIDER` is a job
# that is skipped forever and never says why. infra/pulumi/contract_test.go asserts the match.
#
# This file is copied verbatim by cookiecutter (`_copy_without_render` in cookiecutter.json).
# GitHub Actions' ${{ ... }} and Jinja's {{ ... }} are the same two braces, so rendering this file
# would strip every expression in it. Nothing here may contain a cookiecutter variable; anything
# project-specific comes from a repository variable instead.
name: CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/cd.yml'
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write    # required for Workload Identity Federation

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: vars.WIF_PROVIDER != ''
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Keyless: a downloaded service-account JSON key is a long-lived credential in a file, and
      # the handbook bans them outright. Ask Athena for the approved-library list if you are
      # tempted by an action that wants one.
      #
      # The house rule on third-party actions is a released major version at minimum and a pinned
      # digest for anything handling credentials. This is that anything: replace `@v2` with
      # `@<sha>` before you rely on this pipeline, and record the version the digest corresponds to
      # in a comment beside it.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate to Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      # The Go build happens inside the Dockerfile's builder stage — CGO off, a static binary at
      # /app/api, copied into distroless — so this job needs no Go toolchain of its own.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/docker/Dockerfile.prod
          target: production
          platforms: linux/amd64
          push: true
          # An immutable :sha tag, never :latest. A rollback is then a known image rather than a
          # guess about what :latest pointed at last Tuesday.
          tags: ${{ vars.IMAGE_REPO }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}
          # Reported by /health/ready, so a deployed revision can say which commit it is.
          build-args: GIT_SHA=${{ github.sha }}
          # An explicit scope, so a second deploy pipeline in this repository — a grafted
          # frontend-cd.yml uses `scope=frontend` — does not evict this one's layers.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend   # mode=max caches the builder stage too

      # Migrations run before the new revision takes traffic, and are expected to be
      # backward-compatible with the currently-deployed code. Ask Athena for the database access
      # and migrations rules for what "backward-compatible" has to mean here.
      #
      # The job runs the image just pushed with `/app/api migrate up` — goose, with the migrations
      # embedded in the binary — so the schema and the code that expects it ship as one artefact.
      - name: Migrate
        if: vars.CLOUD_RUN_MIGRATE_JOB != ''
        run: |
          set -euo pipefail
          IMAGE="${{ vars.IMAGE_REPO }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}"
          gcloud run jobs update "${{ vars.CLOUD_RUN_MIGRATE_JOB }}" \
            --image "$IMAGE" --region "${{ vars.GCP_REGION }}" --quiet
          gcloud run jobs execute "${{ vars.CLOUD_RUN_MIGRATE_JOB }}" \
            --region "${{ vars.GCP_REGION }}" --wait

      # `update`, not `deploy`. The shape of the service — service account, secrets, the Cloud SQL
      # attachment, CORS — belongs to infrastructure-as-code. This pipeline owns exactly one field:
      # the image. Two tools writing the same resource is how a plan fills up with phantom drift.
      - name: Deploy
        run: |
          set -euo pipefail
          gcloud run services update "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image "${{ vars.IMAGE_REPO }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}" \
            --region "${{ vars.GCP_REGION }}" \
            --quiet

      - name: Smoke test
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region "${{ vars.GCP_REGION }}" --format='value(status.url)')

          # Liveness is what this pipeline is responsible for: the revision started and serves.
          curl -fsS "$URL/health/live" >/dev/null
          echo "live: $URL"

          # Readiness can depend on something this pipeline does not do — a dependency that is not
          # up yet, a first-run backfill. Report it, do not fail on it: failing here means a
          # service's first deploy can never succeed. Download to a file rather than piping into
          # grep, which closes the pipe and kills curl under `pipefail` on a check that had passed.
          code=$(curl -s -o /tmp/ready.json -w '%{http_code}' "$URL/health/ready")
          cat /tmp/ready.json
          if [ "$code" != "200" ]; then
            echo "::warning::$URL is live but not ready — check its dependencies"
          fi

      # Without this, Sentry cannot attribute a regression to a commit.
      - name: Create Sentry release
        if: vars.SENTRY_ORG != ''
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          version: ${{ github.sha }}
          environment: production
          set_commits: auto
