# The whole local stack. `just dev` from a clean clone must reach a running service in under five
# minutes. Ask Athena for the local development and command runner rules.
#
# This file is at the repository ROOT, not in backend/, because it orchestrates more than one
# component: today the database and the backend, tomorrow a web client alongside them. A compose
# file per component cannot express "the frontend waits for the backend to be healthy".

name: {{ cookiecutter.project_slug }}

services:
  # Named `backend` and listening on 8000 on purpose: a React client generated from the FastAPI
  # template fetches http://backend:8000/openapi.json to build its types, and drops in unchanged.
  backend: &backend
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.dev
    env_file: .env
    environment:
      # Pinned here so a .env tuned for host access (localhost:5432) still works inside the
      # container, where the database is reachable as db:5432.
      {%- if cookiecutter.use_postgres == "yes" %}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      {%- endif %}
      ENVIRONMENT: local
      PORT: 8000
    volumes:
      # The whole module: Go compiles from source, and air watches it.
      - ./backend:/app
      # Named volumes for the module and build caches, so a container restart does not re-download
      # every dependency or recompile the world. Shared by every service built from this image.
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    {%- if cookiecutter.use_postgres == "yes" %}
    depends_on:
      db:
        condition: service_healthy
    {%- endif %}

  # Same image and same mounts, no server. Used by `just lint`, `just fmt`, `just gen`, `just db-*`.
  # Keeping tooling in one image is what stops "passes locally, fails in CI".
  dev-runner:
    <<: *backend
    ports: []
    command: ["sleep", "infinity"]
    profiles: ["tools"]
{% if cookiecutter.use_postgres == "yes" %}
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-{{ cookiecutter.project_slug.replace('-', '_') }}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-not-a-secret}
      POSTGRES_DB: ${POSTGRES_DB:-{{ cookiecutter.project_slug.replace('-', '_') }}}
    ports:
      # Overridable, because the host port is the one thing in this file that can collide with
      # something outside the project. Two services generated from this template, or one alongside
      # any other Postgres on the machine, otherwise fail to start with "port is already
      # allocated" — which reads as a problem with the new project rather than with the port.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # `depends_on` alone does not wait for readiness; this is what makes it mean something.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-{{ cookiecutter.project_slug.replace('-', '_') }}}"]
      interval: 2s
      timeout: 3s
      retries: 30
{% endif %}
volumes:
  go-mod-cache:
  go-build-cache:
{%- if cookiecutter.use_postgres == "yes" %}
  db-data:
{%- endif %}
