# Build, push and deploy the backend to ECS Express Mode.
#
# Inert until configured: the job is gated on the deploy role's repository variable, so a freshly
# generated repository has a reviewed deploy path that cannot fire by accident. Set the repository
# variables below and it starts working — no edit to this file required. Each is prefixed with the
# component's name, so two components in one repository never read each other's:
#
#   __COMPONENT_VAR___AWS_DEPLOY_ROLE_ARN      arn:aws:iam::<account>:role/<name>-deploy-<env>
#   __COMPONENT_VAR___AWS_REGION               eu-west-1
#   __COMPONENT_VAR___IMAGE_REPO               <account>.dkr.ecr.<region>.amazonaws.com/<name>-<env>
#   __COMPONENT_VAR___ECS_CLUSTER              the ECS cluster the service runs in
#   __COMPONENT_VAR___ECS_SERVICE              the Express service's name, for following its rollout
#   __COMPONENT_VAR___ECS_SERVICE_ARN          the Express service's ARN, for describe/update
#   __COMPONENT_VAR___SERVICE_URL              https://<endpoint>, for the smoke test
#   __COMPONENT_VAR___ECS_TASK_SUBNETS         comma-separated subnet ids the migration task runs in
#   __COMPONENT_VAR___ECS_TASK_SECURITY_GROUP  the security group the migration task runs as
#   __COMPONENT_VAR___ECS_MIGRATE_TASK_FAMILY  the family that runs `/app/api migrate up` (unset with no database)
#
# Do not set them by hand. The component's infra/pulumi exports every one of them and its
# infra/scripts/sync-github.sh copies them in, so the names on both sides cannot drift — a stack
# exporting `deploy_role` to a pipeline reading another name is a job that is skipped forever and
# never says why. infra/pulumi/contract_test.go asserts the match.
#
# The first image is not this pipeline's: `just infra-first-deploy` builds it on a laptop and creates
# the service on it, because the service cannot exist before an image does. Every image after that
# one is built here.
#
# This file is copied verbatim by cookiecutter (`_copy_without_render` in cookiecutter.json).
# GitHub Actions' ${{ ... }} and Jinja's {{ ... }} are the same two braces, so rendering this file
# would strip every expression in it. The post-generation hook substitutes two tokens instead — the
# component's folder name, and the same name upper-cased as a variable prefix — and writes the
# result to the repository root as .github/workflows/__COMPONENT__-cd.yml. Nothing else here may be
# project-specific; anything that is comes from a repository variable instead.
name: __COMPONENT__ CD

on:
  push:
    branches: [main]
    paths:
      - '__COMPONENT__/backend/**'
      - '.github/workflows/__COMPONENT__-cd.yml'
  workflow_dispatch:

concurrency:
  group: __COMPONENT__-cd
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write    # required for the GitHub OIDC token the deploy role trusts

# The component's folder. Every job checks out first: a run step's working directory does not exist
# until the repository is on disk.
defaults:
  run:
    working-directory: __COMPONENT__

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: vars.__COMPONENT_VAR___AWS_DEPLOY_ROLE_ARN != ''
    # The deploy role trusts a token whose subject is this environment and nothing else. Give the
    # environment protection rules in the repository settings; they are the gate on a deploy.
    environment: production
    env:
      IMAGE: ${{ vars.__COMPONENT_VAR___IMAGE_REPO }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Keyless: an access key in a repository secret is a long-lived credential in a file, and the
      # handbook bans them outright. GitHub's OIDC token is exchanged for a session of an hour.
      #
      # The house rule on third-party actions is a released major version at minimum and a pinned
      # digest for anything handling credentials. This is that anything: replace `@v4` with
      # `@<sha>` before you rely on this pipeline, and record the version the digest corresponds to
      # in a comment beside it.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.__COMPONENT_VAR___AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.__COMPONENT_VAR___AWS_REGION }}

      # The same rule: it handles a registry credential. Pin a digest.
      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # The Go build happens inside the Dockerfile's builder stage — CGO off, a static binary at
      # /app/api, copied into distroless — so this job needs no Go toolchain of its own.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: __COMPONENT__/backend
          file: __COMPONENT__/backend/docker/Dockerfile.prod
          target: production
          # Fargate in Express Mode runs x86_64 unless told otherwise.
          platforms: linux/amd64
          push: true
          # An immutable :sha tag, never :latest — and the repository is IMMUTABLE, so a tag
          # cannot be pushed twice. A rollback is then a known image rather than a guess.
          tags: ${{ env.IMAGE }}
          # Reported by /health/ready, so a deployed task can say which commit it is.
          build-args: GIT_SHA=${{ github.sha }}
          # Scoped to the component, so another component's image built in this repository's
          # Actions cache does not evict this one's layers.
          cache-from: type=gha,scope=__COMPONENT__
          cache-to: type=gha,mode=max,scope=__COMPONENT__   # mode=max caches the builder stage too

      # Migrations run before the new image takes traffic, and are expected to be
      # backward-compatible with the currently-deployed code. Ask Athena for the database access
      # and migrations rules for what "backward-compatible" has to mean here.
      #
      # The task runs the image just pushed with `/app/api migrate up` — goose, with the migrations
      # embedded in the binary — so the schema and the code that expects it ship as one artefact.
      #
      # The stack owns the task definition's shape; this step owns its image. It takes the latest
      # ACTIVE revision of the family — Pulumi's, or the one this step registered last time — strips
      # the fields describe returns and register refuses, swaps the image, and registers the result
      # as the next revision. Nothing else about the task changes, so the stack's roles, secrets
      # and log group are exactly what the migration runs with.
      - name: Migrate
        if: vars.__COMPONENT_VAR___ECS_MIGRATE_TASK_FAMILY != ''
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "${{ vars.__COMPONENT_VAR___ECS_MIGRATE_TASK_FAMILY }}" \
            --query taskDefinition --output json > current.json
          jq --arg image "$IMAGE" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                .registeredAt, .registeredBy, .deregisteredAt)
            | .containerDefinitions[0].image = $image
          ' current.json > next.json
          TASK_DEFINITION=$(aws ecs register-task-definition --cli-input-json file://next.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "registered $TASK_DEFINITION"

          # Public IP on: the task subnets have no NAT, and the task pulls its image and reads its
          # secret over the internet gateway. The security group is the stack's app group, the one
          # the database admits.
          TASK=$(aws ecs run-task \
            --cluster "${{ vars.__COMPONENT_VAR___ECS_CLUSTER }}" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEFINITION" \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.__COMPONENT_VAR___ECS_TASK_SUBNETS }}],securityGroups=[${{ vars.__COMPONENT_VAR___ECS_TASK_SECURITY_GROUP }}],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "started $TASK"

          # run-task returns once the task is placed, not once it has finished. Wait, then read
          # the container's exit code: a migration that failed must stop the deploy here, before
          # the service is rolled onto a schema that was never applied.
          aws ecs wait tasks-stopped --cluster "${{ vars.__COMPONENT_VAR___ECS_CLUSTER }}" --tasks "$TASK"
          aws ecs describe-tasks --cluster "${{ vars.__COMPONENT_VAR___ECS_CLUSTER }}" --tasks "$TASK" \
            --query 'tasks[0]' --output json > task.json
          EXIT_CODE=$(jq -r '.containers[0].exitCode // "none"' task.json)
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::migration exited with $EXIT_CODE: $(jq -r '.stoppedReason // ""' task.json)"
            # The migration's own log, rather than "exit code 1". The stream is
            # <prefix>/<container>/<task id>, as the awslogs driver names it.
            GROUP=$(jq -r '.containerDefinitions[0].logConfiguration.options["awslogs-group"]' next.json)
            PREFIX=$(jq -r '.containerDefinitions[0].logConfiguration.options["awslogs-stream-prefix"]' next.json)
            CONTAINER=$(jq -r '.containerDefinitions[0].name' next.json)
            aws logs get-log-events --log-group-name "$GROUP" \
              --log-stream-name "$PREFIX/$CONTAINER/${TASK##*/}" \
              --query 'events[].message' --output text || true
            exit 1
          fi
          echo "migrated"

      # Update, not recreate. The shape of the service — roles, secrets, scaling, network, CORS —
      # belongs to infrastructure-as-code. This pipeline owns exactly one field: the image.
      #
      # The whole primary container is sent back with only the image changed, because the API does
      # not document whether a partial primary container merges or replaces; sending all of it is
      # correct either way. Nulls are dropped because describe returns fields the update refuses.
      - name: Deploy
        env:
          CLUSTER: ${{ vars.__COMPONENT_VAR___ECS_CLUSTER }}
          SERVICE: ${{ vars.__COMPONENT_VAR___ECS_SERVICE }}
          SERVICE_ARN: ${{ vars.__COMPONENT_VAR___ECS_SERVICE_ARN }}
        run: |
          set -euo pipefail
          aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" --output json > service.json
          jq --arg image "$IMAGE" \
            '.service.activeConfigurations[0].primaryContainer | .image = $image | del(..|nulls)' \
            service.json > primary-container.json
          # The deployment running now, so the wait below can tell it from the one this update starts.
          # shellcheck disable=SC2016  # the backticks are a JMESPath literal, not command substitution
          BEFORE=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].deployments[?status==`PRIMARY`] | [0].id' --output text)
          aws ecs update-express-gateway-service --service-arn "$SERVICE_ARN" \
            --primary-container file://primary-container.json > /dev/null

          # Wait on the new deployment's own rollout state, not on the generic services-stable waiter.
          # An Express deployment is a canary with a bake time — a healthy one took 10 min 40 s on
          # its first real run, and that waiter gives up at ten. The rollout state also reads FAILED
          # the moment ECS rolls back, so a broken image fails this job in minutes, not at a timeout.
          # The previous deployment is excluded by id, or its COMPLETED would end the wait at once.
          DEADLINE=$((SECONDS + 1800))
          while :; do
            DEPLOYMENTS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query 'services[0].deployments[].[id, status, rolloutState]' --output text)
            if awk -v before="$BEFORE" '$1 != before && $3 == "FAILED"' <<<"$DEPLOYMENTS" | grep -q .; then
              aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
                --query 'services[0].events[:5].message' --output text | tr '\t' '\n'
              echo "::error::$SERVICE rolled back: the new deployment failed"; exit 1
            fi
            if awk -v before="$BEFORE" '$1 != before && $2 == "PRIMARY" && $3 == "COMPLETED"' \
              <<<"$DEPLOYMENTS" | grep -q .; then
              break
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::$SERVICE's rollout did not finish in 30 minutes"; exit 1
            fi
            sleep 20
          done

          # Completed is not the same as "running this image": a rollback also completes. Confirm
          # the update is the one that landed.
          aws ecs describe-express-gateway-service --service-arn "$SERVICE_ARN" --output json |
            jq -e --arg image "$IMAGE" \
              '[.service.activeConfigurations[].primaryContainer.image] | index($image) != null' \
              >/dev/null || { echo "::error::$SERVICE finished but is not running $IMAGE"; exit 1; }
          echo "deployed $IMAGE"

      - name: Smoke test
        run: |
          set -euo pipefail
          URL="${{ vars.__COMPONENT_VAR___SERVICE_URL }}"

          # Liveness is what this pipeline is responsible for: the task started and serves.
          curl -fsS "$URL/health/live" >/dev/null
          echo "live: $URL"

          # Readiness can depend on something this pipeline does not do — a dependency that is not
          # up yet, a first-run backfill. Report it, do not fail on it: failing here means a
          # service's first deploy can never succeed. Download to a file rather than piping into
          # grep, which closes the pipe and kills curl under `pipefail` on a check that had passed.
          code=$(curl -s -o /tmp/ready.json -w '%{http_code}' "$URL/health/ready")
          cat /tmp/ready.json
          if [ "$code" != "200" ]; then
            echo "::warning::$URL is live but not ready — check its dependencies"
          fi

  # Its own job, after the deploy, rather than a step inside it. A Docker-based action's image is
  # pulled when its job starts, whether or not the step runs, so a skipped step still cost every
  # deploy the pull; a skipped job never starts a runner. Without it, Sentry cannot attribute a
  # regression to a commit.
  sentry-release:
    name: Sentry release
    needs: deploy
    if: vars.__COMPONENT_VAR___SENTRY_ORG != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # set_commits: auto reads the history since the previous release
      - uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.__COMPONENT_VAR___SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.__COMPONENT_VAR___SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.__COMPONENT_VAR___SENTRY_PROJECT }}
        with:
          version: ${{ github.sha }}
          environment: production
          set_commits: auto
