# The dev stack. Cheapest viable configuration at every layer.
#
# `pulumi stack init dev --secrets-provider=gcpkms://...` records `secretsprovider` and
# `encryptedkey` in this file alongside the configuration below. The bootstrap script prints the
# exact command with the key it created. Every key below is read in one place:
# internal/stackconfig/config.go.
config:
  {{ cookiecutter.__name }}:project: {{ cookiecutter.gcp_project_id }}
  {{ cookiecutter.__name }}:region: {{ cookiecutter.gcp_region }}
  # The STACK's environment. All it does is name resources — `{{ cookiecutter.__name }}-dev`,
  # and every account, secret and repository with the same suffix. The application never sees it.
  {{ cookiecutter.__name }}:environment: dev
  # The APPLICATION's environment: the `ENVIRONMENT` variable on the Cloud Run revision, and one
  # of local / test / staging / production. It decides how the service behaves — `production`
  # serves no `/docs` and no `/openapi.json`. Separate from the line above because a stack called
  # `dev` that the whole company can reach is production to the application, and a stack called
  # `prod` standing up a demo is not. Set it to `production` in the stack real users reach.
  {{ cookiecutter.__name }}:appEnvironment: staging
  # The repository's slug and the component's name. Every resource name is built from it, so it
  # is not decoration, and two components in one project never share one. Changing it renames the
  # Cloud Run service, the registry repository and the service accounts.
  {{ cookiecutter.__name }}:slug: {{ cookiecutter.__name }}
  # The image the Cloud Run service{% if cookiecutter.use_postgres == "yes" %} and its migration job{% endif %} are created on. Empty until
  # `just infra-first-deploy` builds the real image, pushes it and records it here, and until then
  # the stack creates everything but the service — there is no placeholder image. After the first
  # deploy CD owns the image; this stays what the service was first created with.
  {{ cookiecutter.__name }}:serviceImage: ""
  # Workload Identity Federation is scoped to exactly this repository. Anything else here means
  # some other repository can assume the CI identity.
  {{ cookiecutter.__name }}:githubRepository: {{ cookiecutter.github_repository }}
  # Scaling to zero is the single biggest cost lever: an idle service costs nothing. Raise the
  # minimum only when a measured cold start is the problem.
  {{ cookiecutter.__name }}:minInstances: "0"
  {{ cookiecutter.__name }}:maxInstances: "4"
  # Browser origins allowed to call the API, comma-separated; CORS_ORIGINS on the service. Empty
  # means no browser on another origin may call it. A browser client is generated from
  # templates/cookiecutter-react-app into its own repository with its own stack (ADR-0022): put
  # that stack's `site_url` output here.
  {{ cookiecutter.__name }}:corsOrigins: ""
{%- if cookiecutter.use_postgres == "yes" %}
  # Where the refresh token travels; REFRESH_TRANSPORT on the service. `body` for a server-to-server
  # caller, `cookie` for a browser client, and `cookie` needs corsOrigins. A session that survives a
  # reload also needs the SPA and the API on one site: the React template serves this API under
  # /api/* on the app's own origin by default, and corsOrigins then names that origin, which the
  # cookie routes' CSRF check reads. A domain of your own is the other way.
  {{ cookiecutter.__name }}:refreshTransport: body
{%- endif %}
{%- if cookiecutter.use_postgres == "yes" %}
  # Cloud SQL. Shared-core with 10 GB of HDD is the floor for a managed Postgres on GCP, and it is
  # the only standing charge in this stack. There is no cheaper setting to find: infra/README.md
  # has the table of why each value is already its minimum, and what the floor costs you.
  {{ cookiecutter.__name }}:databaseTier: db-f1-micro
  {{ cookiecutter.__name }}:databaseDiskGb: "10"
  # Version numbers, not values: `just infra-secrets dev` generates the token signing key and the
  # database admin password, adds each to its Secret Manager container, sets the password on the
  # `postgres` login, and writes the two numbers here. Until both are set the stack mounts neither
  # and exports secrets_ready=false, and sync-github.sh will not un-gate CD. Never type a value here.
  {{ cookiecutter.__name }}:jwtSecretVersion: ""
  {{ cookiecutter.__name }}:dbAdminPasswordVersion: ""
{%- endif %}
{%- if cookiecutter.use_sentry == "yes" %}
  # Set to the version number `gcloud secrets versions add {{ cookiecutter.__name }}-sentry-dsn-dev --data-file=-`
  # prints. Until then the container is empty, and mounting an empty container fails the deploy
  # rather than starting the service without error tracking.
  {{ cookiecutter.__name }}:sentryDsnVersion: ""
{%- endif %}
