# Gates run fastest-first, so a formatting error fails in thirty seconds rather than after a
# six-minute test run. CI pipelines is a backlog topic in the handbook.
#
# This file is copied verbatim by cookiecutter (`_copy_without_render` in cookiecutter.json).
# GitHub Actions' ${{ ... }} and Jinja's {{ ... }} are the same two braces, so rendering this file
# would strip every expression in it. That is the single most common way these templates break.
# The consequence: nothing here may contain a cookiecutter variable. Two tokens are the only
# templating — `__COMPONENT__`, the component's name, and `__COMPONENT_VAR__`, the same in capitals —
# and the post-generation hook substitutes them as plain text when it installs this file as
# `.github/workflows/__COMPONENT__-ci.yml`. Anything project-specific comes from a repository
# variable instead.
name: __COMPONENT__ CI

on:
  pull_request:
    # Per-component filter. A change to another component, or a README elsewhere, should not run
    # this Python suite. The secret scan runs here too, so a change to what it allowlists —
    # `__COMPONENT__/.gitleaks.toml` — re-runs it.
    paths:
      - '__COMPONENT__/**'
      - '.github/workflows/__COMPONENT__-ci.yml'
  push:
    branches: [main]
    paths:
      - '__COMPONENT__/**'
      - '.github/workflows/__COMPONENT__-ci.yml'

concurrency:
  group: __COMPONENT__-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: __COMPONENT__

jobs:
  static:
    name: Lint, types, contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: __COMPONENT__/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: __COMPONENT__/backend/uv.lock
      - run: uv sync --frozen        # fails loudly on a stale lockfile
      - run: uv run ruff check app/ tests/
      - run: uv run ruff format --check app/ tests/
      - run: uv run mypy app/
      - run: uv run lint-imports     # the layer contracts, mechanically
      # Counting heads, not `alembic check`. This job has no database and no POSTGRES_*, and
      # `alembic check` compares the models against a live one — it resolves the compose hostname
      # `db`, fails on DNS, and says nothing about migrations. `alembic heads` reads the versions
      # directory and nothing else. The guard in front is for a project generated without a
      # database, which has no `alembic/` at all.
      - name: Single migration head
        run: test ! -d alembic || test "$(uv run alembic heads | wc -l | tr -d ' ')" -eq 1

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [static]
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: test
        ports: ['5432:5432']
        # Service containers cannot take a `command`, so fsync stays on here; the compose overlay
        # used locally does the tmpfs trick instead.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: __COMPONENT__/backend
    env:
      ENVIRONMENT: test
      JSON_LOGS: 'false'
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: test
      SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: __COMPONENT__/backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -n auto --dist=loadscope --cov=app --cov-report=term-missing

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: [static]
    defaults:
      run:
        working-directory: __COMPONENT__/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: __COMPONENT__/backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pip-audit

  # The gitleaks CLI from its own release image, not `gitleaks/gitleaks-action`: the action needs a
  # paid licence key on any repository an organisation owns, and fails without one. The image is
  # pinned to a release; move the tag deliberately. It scans this component's history — every commit
  # that touched `__COMPONENT__/`, which is why the checkout is the full one — with the component's
  # own config, and exits non-zero on a finding, which fails the job.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history, not just the diff
      # The image's own git config trusts every directory (`safe.directory=*`), so a checkout owned
      # by the runner's user is readable by the container's root.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . --log-opts="-- __COMPONENT__" \
            --config __COMPONENT__/.gitleaks.toml --redact --no-banner
