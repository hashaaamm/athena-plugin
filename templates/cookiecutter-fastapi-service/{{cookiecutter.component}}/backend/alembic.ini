[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# The URL comes from Settings at runtime — see alembic/env.py. It is deliberately absent here so a
# credential can never end up in a tracked file, and so ConfigParser's `%` handling can never
# mangle a perfectly valid password.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
