# Build, push and deploy the nginx image to Cloud Run.
#
# Inert until configured: the job is gated on `vars.DEPLOY_SA`, so a freshly generated repository
# has a reviewed deploy path that cannot fire by accident. Set the repository variables below and
# it starts working — no edit to this file required.
#
#   WIF_PROVIDER       projects/…/workloadIdentityPools/…/providers/github
#   DEPLOY_SA          <slug>-deploy-<env>@<project>.iam.gserviceaccount.com
#   GCP_REGION         europe-west1
#   IMAGE_REPO         europe-west1-docker.pkg.dev/<project>/<repo>
#   CLOUD_RUN_SERVICE  the Cloud Run service serving the bundle
#   SITE_URL           https://<service>-<hash>.<region>.run.app, for the smoke test
#   API_URL            the backend's address — compiled INTO the bundle, see below
#
# All but the last are exported by `infra/pulumi` and copied in by `./infra/scripts/sync-github.sh`,
# so the names on both sides cannot drift; infra/pulumi/tests/contract.test.ts asserts the match.
# API_URL is the one a human sets, because it belongs to another repository's stack.
#
# **The ordering that makes this correct.** Vite inlines VITE_* at build time, so the API origin is
# compiled into the JavaScript and cannot be changed afterwards by any amount of Cloud Run
# configuration. A bundle built without one would call the local development address, deploy
# cleanly, serve a page and answer nothing — so the first step refuses to build instead.
#
# This file is copied verbatim by cookiecutter (`_copy_without_render` in cookiecutter.json).
# GitHub Actions' ${{ ... }} and Jinja's {{ ... }} are the same two braces, so rendering this file
# would strip every expression in it. Nothing here may contain a cookiecutter variable; anything
# project-specific comes from a repository variable instead.
name: CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'docker/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/cd.yml'
  # Also the way to rebuild after API_URL changes: nothing in the repository has to change for the
  # deployed bundle to be wrong.
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write    # required for Workload Identity Federation

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    if: vars.DEPLOY_SA != ''
    # Give this environment protection rules in the repository settings — required reviewers, or a
    # branch restriction to main. They are the gate on a deploy.
    environment: production
    env:
      IMAGE: ${{ vars.IMAGE_REPO }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}
    steps:
      # Resolved before anything is built, because the alternative is discovering it from a browser
      # console after the deploy reported success. Read through `env:` rather than interpolated
      # into the script: a repository variable is untrusted input to a shell otherwise.
      - name: Resolve the API origin
        id: origin
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL is not set, so this build would compile the local development" \
                 "address into the bundle. Set the repository variable to the backend's URL" \
                 "(infra/README.md), then re-run this workflow."
            exit 1
          fi
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "the bundle will call $API_URL"

      - uses: actions/checkout@v4

      # Keyless: a downloaded service-account JSON key is a long-lived credential in a file, and
      # the handbook bans them outright.
      #
      # The house rule on third-party actions is a released major version at minimum and a pinned
      # digest for anything handling credentials. This is that anything: replace `@v2` with
      # `@<sha>` before you rely on this pipeline, and record the version the digest corresponds to
      # in a comment beside it.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate to Artifact Registry
        env:
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          target: production
          platforms: linux/amd64
          push: true
          # An immutable :sha tag, never :latest. A rollback is then a known image rather than a
          # guess about what :latest pointed at last Tuesday.
          tags: ${{ env.IMAGE }}
          # A build arg and not an environment variable, because it is inlined into the JavaScript
          # rather than read at runtime. The same value in `docker run` would arrive too late.
          build-args: VITE_API_URL=${{ steps.origin.outputs.url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `update`, not `deploy`. The shape of the service — its account, scaling, the probe —
      # belongs to infrastructure-as-code. This pipeline owns exactly one field: the image. Two
      # tools writing the same resource is how a plan fills up with phantom drift.
      - name: Deploy
        env:
          SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          gcloud run services update "$SERVICE" --image "$IMAGE" --region "$GCP_REGION" --quiet

      - name: Smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          # The index: nginx started and the bundle is on disk.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/")
          [ "$code" = "200" ] || { echo "::error::$SITE_URL/ answered $code"; exit 1; }

          # A route the server has no file for. It must still answer 200 with index.html — that is
          # the SPA fallback in docker/default.conf.template, and without it every hard refresh on
          # a real route is a 404 that only the person who bookmarked it ever sees.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/some/deep/route")
          [ "$code" = "200" ] || { echo "::error::$SITE_URL/some/deep/route answered $code"; exit 1; }
          echo "serving: $SITE_URL"
