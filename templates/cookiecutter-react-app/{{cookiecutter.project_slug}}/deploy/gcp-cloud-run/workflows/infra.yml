# Infrastructure CI.
#
# The stack tests run on every pull request and need no cloud credentials — that is most of the
# argument for Pulumi over HCL, so it is the cheapest and most-run job here. The preview needs
# cloud access and is gated on the stack having been applied at least once; its diff is posted to
# the pull request, because a preview nobody reads is not a review.
#
# This file is copied verbatim by cookiecutter (`_copy_without_render` in cookiecutter.json).
# GitHub Actions' ${{ ... }} and Jinja's {{ ... }} are the same two braces, so rendering this file
# would strip every expression in it. Nothing here may contain a cookiecutter variable; anything
# project-specific comes from a repository variable instead.
name: Infrastructure

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
      # tests/contract.test.ts reads the deploy workflow, so changing it re-checks the names.
      - '.github/workflows/cd.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
      - '.github/workflows/cd.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write        # required for Workload Identity Federation
  pull-requests: write   # the preview comments its diff

defaults:
  run:
    working-directory: infra/pulumi

jobs:
  static:
    name: Types, lint and stack tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `package_json_file` is not optional here: the action looks in the repository root, which
      # is the application's package.json, and `defaults.run` does not reach an action.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: infra/pulumi/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pulumi/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile   # fails loudly on a stale lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  preview:
    name: Preview
    runs-on: ubuntu-latest
    needs: [static]
    # Inert until the stack has been applied once and sync-github.sh has set the variables. A
    # preview against a stack that does not exist fails on state, not on the change under review.
    if: github.event_name == 'pull_request' && vars.PREVIEW_SA != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: infra/pulumi/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/pulumi/pnpm-lock.yaml
      # Pulumi runs index.ts with the TypeScript and ts-node installed here.
      - run: pnpm install --frozen-lockfile

      # Keyless, and the PREVIEW account, not the deploy one: it reads the project and this
      # backend's state, and can change neither. Pin this to a digest rather than `@v2` before you
      # rely on the pipeline: the house rule is a released major at minimum, and a pinned digest for
      # anything that handles credentials.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PREVIEW_SA }}

      - uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: dev
          work-dir: infra/pulumi
          # Load-bearing, not hygiene. CD updates the Cloud Run image out of band; without a
          # refresh Pulumi's state still holds the previous image, `ignoreChanges` has nothing to
          # preserve, and the preview proposes rolling the site back to it.
          refresh: true
          # A destructive change must be visible in review, not discovered in apply output.
          comment-on-pr: true
          diff: true
