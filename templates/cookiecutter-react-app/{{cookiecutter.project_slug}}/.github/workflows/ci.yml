# The application's gate. Fastest first, so a lint error fails in thirty seconds rather than after
# the build. The same for every deploy target: what deploys, and where, is cd.yml's business.
#
# This file is copied verbatim by cookiecutter (`_copy_without_render` in cookiecutter.json).
# GitHub Actions' ${{ ... }} and Jinja's {{ ... }} are the same two braces, so rendering this file
# would strip every expression in it. That is the single most common way these templates break.
# The consequence: nothing here may contain a cookiecutter variable. Anything project-specific
# comes from a repository variable instead.
name: CI

on:
  pull_request:
    # The application is at the repository root, so the filter names what it is made of rather
    # than one directory. infra/ has its own workflow, and a README change runs neither.
    paths:
      - 'src/**'
      - 'public/**'
      - 'docker/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - '*.config.ts'
      - '*.config.js'
      - 'components.json'
      - '.github/workflows/ci.yml'
      # The secret scan runs here, so a change to what it allowlists — or to the one file it is
      # allowlisted for — has to re-run it.
      - '.gitleaks.toml'
      - 'infra/pulumi/Pulumi.*.yaml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'docker/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - '*.config.ts'
      - '*.config.js'
      - 'components.json'
      - '.github/workflows/ci.yml'
      # The secret scan runs here, so a change to what it allowlists — or to the one file it is
      # allowlisted for — has to re-run it.
      - '.gitleaks.toml'
      - 'infra/pulumi/Pulumi.*.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pinned version from package.json's `packageManager` field, so CI and the
      # container in docker-compose.yml resolve dependencies identically.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile   # fails loudly on a stale lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Production bundle
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A build that only ever runs at deploy time is a build that breaks at deploy time.
      - run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history, not just the diff
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
