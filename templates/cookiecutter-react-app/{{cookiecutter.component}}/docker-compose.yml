# Local development: the Vite dev server, in a container, against the backend at VITE_API_URL.
# `just dev` from a clean clone must reach a running app in under five minutes. Ask Athena for the
# local development and command runner rules.
#
# The backend is not in this file: it is another component, with its own Compose stack, run beside
# this one. The browser calls it directly at VITE_API_URL — {{ cookiecutter.api_url }} unless `.env`
# says otherwise.
#
# The project name carries the component, so two components' containers, networks and volumes never
# share a name, whichever folder Compose is run from.
name: {{ cookiecutter.__name }}

services:
  # A stock Node image with the source bind-mounted, rather than a dev image to build and rebuild:
  # Vite's dev server is the same binary everywhere, and the only thing an image would add here is a
  # cache to invalidate. The production image is a different file entirely.
  app:
    image: node:24-slim
    working_dir: /app
    # corepack activates the exact pnpm pinned in package.json's `packageManager` field, so the
    # container and CI resolve dependencies identically. --frozen-lockfile makes a stale lockfile
    # a startup failure rather than a silent re-resolve: run `just lock` and commit.
    # `exec` on the last command so Vite becomes PID 1 and receives SIGTERM directly. Without it
    # `sh` holds PID 1, the signal never reaches Vite, and `docker compose down` waits out the full
    # stop timeout on every shutdown.
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && exec pnpm dev"
    # VITE_API_URL and VITE_API_SCHEMA_URL. The BROWSER makes the API requests, so VITE_API_URL is
    # the address as your machine sees it, not as this container does. Vite reads it on start.
    env_file: .env
    environment:
      # corepack asks before it downloads pnpm, and a `docker compose run` with a TTY would sit at
      # that question forever.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - .:/app
      # A named volume, so the container's node_modules (Linux binaries) never collide with a host
      # install (macOS binaries) through the bind mount above.
      - node-modules:/app/node_modules
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    # `just gen-api` runs in this container and fetches the backend's OpenAPI document, and
    # `localhost` in here is the container. host.docker.internal is your machine: Docker Desktop
    # provides the name on macOS and Windows, and this line provides it on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  node-modules:
