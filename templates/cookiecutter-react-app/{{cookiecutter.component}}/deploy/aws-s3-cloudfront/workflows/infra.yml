# Infrastructure CI.
#
# The stack tests run on every pull request and need no cloud credentials — that is most of the
# argument for Pulumi over HCL, so it is the cheapest and most-run job here. The preview needs
# cloud access and is gated on the stack having been applied at least once; its diff is posted to
# the pull request, because a preview nobody reads is not a review.
#
# The apply runs when the change merges to main, as the stack's apply role, in the `infrastructure`
# environment. Setting an environment up — the bootstrap, the first `pulumi up` and the first
# deploy — runs once from an operator's machine, because the apply role is one of the things that
# first apply creates. Every apply after it runs here (Pulumi standards MUST-9); one from a laptop
# is the exception that rule forbids.
#
# This file is copied verbatim by cookiecutter (`_copy_without_render` in cookiecutter.json), to
# .github/workflows/__COMPONENT__-infra.yml at the repository root. GitHub Actions' ${{ ... }} and
# Jinja's {{ ... }} are the same two braces, so rendering this file would strip every expression in
# it. The only templating here is two plain tokens the post-generation hook replaces; nothing here
# may contain a cookiecutter variable.
name: __COMPONENT__ Infrastructure

on:
  pull_request:
    paths:
      - '__COMPONENT__/infra/**'
      - '.github/workflows/__COMPONENT__-infra.yml'
      # tests/contract.test.ts reads the component's other workflows, so changing one re-checks the
      # names.
      - '.github/workflows/__COMPONENT__-cd.yml'
      - '.github/workflows/__COMPONENT__-ci.yml'
  push:
    branches: [main]
    paths:
      - '__COMPONENT__/infra/**'
      - '.github/workflows/__COMPONENT__-infra.yml'
      - '.github/workflows/__COMPONENT__-cd.yml'
      - '.github/workflows/__COMPONENT__-ci.yml'

# A pull request's checks cancel in progress, because only its latest commit matters. A push to
# main queues instead: cancelling it could stop the apply halfway through `pulumi up`, leaving
# resources half-changed and the stack locked.
concurrency:
  group: __COMPONENT__-infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write        # required for the GitHub OIDC token the preview and apply roles trust
  pull-requests: write   # the preview comments its diff

defaults:
  run:
    working-directory: __COMPONENT__/infra/pulumi

jobs:
  static:
    name: Types, lint and stack tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `package_json_file` is not optional here: the action looks in the repository root, and
      # `defaults.run` does not reach an action.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: __COMPONENT__/infra/pulumi/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: __COMPONENT__/infra/pulumi/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile   # fails loudly on a stale lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  preview:
    name: Preview
    runs-on: ubuntu-latest
    needs: [static]
    # Inert until the stack has been applied once and sync-github.sh has set the variables. A
    # preview against a stack that does not exist fails on state, not on the change under review.
    # A pull request from a fork gets no id-token permission, so it cannot assume the preview
    # role whatever this condition says; the role's trust policy is the guard, not this line.
    if: github.event_name == 'pull_request' && vars.__COMPONENT_VAR___AWS_PREVIEW_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: __COMPONENT__/infra/pulumi/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: __COMPONENT__/infra/pulumi/pnpm-lock.yaml
      # Pulumi runs index.ts with the TypeScript and ts-node installed here.
      - run: pnpm install --frozen-lockfile

      # Keyless, and the PREVIEW role, not the deploy role: it reads the account and this
      # project's state, and can change neither. Its trust policy admits a pull_request token from
      # this repository and nothing else. Pin this to a digest rather than `@v4` before you rely on
      # the pipeline: the house rule is a released major at minimum, and a pinned digest for
      # anything that handles credentials.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.__COMPONENT_VAR___AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.__COMPONENT_VAR___AWS_REGION }}

      # Pulumi.yaml names the S3 backend, and the stack's secrets provider is the state key, so the
      # role's credentials are all the preview needs — no Pulumi access token.
      - uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: dev
          work-dir: __COMPONENT__/infra/pulumi
          # Every preview refreshes, so the diff is against what is really there rather than against
          # state that predates whatever last changed it.
          refresh: true
          # A destructive change must be visible in review, not discovered in apply output.
          comment-on-pr: true
          diff: true

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: [static]
    # Main only, and inert until sync-github.sh has set the apply role's variable — which it does
    # once the environment has been set up from a machine. The `if` keeps the job off other
    # branches; the role's trust policy is the guard, and it admits a token from the
    # `infrastructure` environment of this repository and nothing else.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.__COMPONENT_VAR___AWS_APPLY_ROLE_ARN != ''
    # The gate on every apply. Give the environment protection rules in the repository settings —
    # required reviewers, and deployment branches limited to main. The role can change anything in
    # the account, so an unprotected environment is an apply nobody approved.
    environment: infrastructure
    # Applies queue, one at a time, and are never cancelled: a `pulumi up` stopped halfway leaves
    # resources half-changed and the stack locked.
    concurrency:
      group: __COMPONENT__-infra-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write    # required for the GitHub OIDC token the apply role trusts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: __COMPONENT__/infra/pulumi/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: __COMPONENT__/infra/pulumi/pnpm-lock.yaml
      # Pulumi runs index.ts with the TypeScript and ts-node installed here.
      - run: pnpm install --frozen-lockfile

      # Keyless, and the APPLY role: the only CI identity that can change the stack. Pin this to a
      # digest rather than `@v4` before you rely on the pipeline: the house rule is a released
      # major at minimum, and a pinned digest for anything that handles credentials.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.__COMPONENT_VAR___AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.__COMPONENT_VAR___AWS_REGION }}

      # The same stack the preview showed the pull request, applied as it merged.
      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: __COMPONENT__/infra/pulumi
          # As for the preview: the apply compares against what is really there, not against state
          # that predates whatever last changed it.
          refresh: true
          diff: true
